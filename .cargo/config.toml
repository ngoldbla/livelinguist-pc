# Windows MSVC: one C runtime for every native library.
# sherpa-onnx-sys ships only static-MT prebuilt libs on Windows, so Rust and
# llama.cpp must use the static CRT (/MT) as well; mixing /MT and /MD fails to
# link (LNK2038 RuntimeLibrary mismatch) once sherpa and llama share a binary.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Read by llama-cpp-sys-2's build script; only affects MSVC targets.
LLAMA_STATIC_CRT = "1"
# cmake-rs reads CMAKE_TOOLCHAIN_FILE_<target>; only the MSVC targets get it.
CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }
CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc = { value = "cmake/msvc-static-crt.cmake", relative = true }

# Linux: sherpa-onnx links as a shared library (see core/crates/ll-asr/Cargo.toml
# and ADR 0022). Its build script copies libsherpa-onnx-c-api.so and
# libonnxruntime.so next to the build outputs, but a dependency's link args do
# not reach the final binary, so every Linux binary looks beside itself.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
