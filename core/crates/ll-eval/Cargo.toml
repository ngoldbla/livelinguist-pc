[package]
name = "ll-eval"
description = "Headless replay/eval CLI with content-free CSV/JSON diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
ll-core = { workspace = true }
ll-config = { workspace = true }
ll-audio = { workspace = true }
ll-asr = { workspace = true }
ll-llm = { workspace = true }
ll-pipeline = { workspace = true }
ll-models = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
unicode-general-category = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
capture = ["ll-audio/capture"]
sherpa = ["ll-asr/sherpa", "dep:ll-models"]
llama = ["ll-llm/llama", "dep:ll-models"]
