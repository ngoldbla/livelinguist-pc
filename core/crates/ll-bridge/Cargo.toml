[package]
name = "ll-bridge"
description = "napi-rs addon exposing the core protocol to the GPUIX UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
name = "livelinguist_core"

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true }
ll-window = { workspace = true }
ll-accel = { workspace = true }
ll-llm = { workspace = true }
ll-models = { workspace = true }
ll-asr = { workspace = true }
ll-audio = { workspace = true }
ll-core = { workspace = true }
ll-config = { workspace = true }
ll-pipeline = { workspace = true }
ll-protocol = { workspace = true }
napi = { workspace = true }
napi-derive = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
napi-build = "2.3.1"

[features]
capture = ["ll-audio/capture"]
sherpa = ["ll-asr/sherpa"]
llama = ["ll-llm/llama"]
