[package]
name = "ll-asr"
description = "ASR engines and per-locale coverage policy (mock/off by default; sherpa feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
ll-core = { workspace = true }

# sherpa-onnx links statically everywhere except Linux. On Linux the static
# onnxruntime and llama.cpp each carry their own `std::regex` template
# instances; the linker keeps one, and onnxruntime then aborts in
# `CreateEnv` (`munmap_chunk(): invalid pointer`) when both models share a
# binary. The shared build keeps onnxruntime's instances inside its own .so.
# Windows (MSVC, static /MT) is unaffected; see ADR 0022.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sherpa-onnx = { workspace = true, optional = true, features = ["static"] }

[target.'cfg(target_os = "linux")'.dependencies]
sherpa-onnx = { workspace = true, optional = true, features = ["shared"] }

[dev-dependencies]
ll-audio = { workspace = true }

[features]
default = []
sherpa = ["dep:sherpa-onnx"]

[[example]]
name = "sherpa_probe"
required-features = ["sherpa"]
