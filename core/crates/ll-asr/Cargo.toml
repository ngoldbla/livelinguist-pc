[package]
name = "ll-asr"
description = "ASR engines and per-locale coverage policy (mock/off by default; sherpa feature)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
ll-core = { workspace = true }
sherpa-onnx = { workspace = true, optional = true }

[dev-dependencies]
ll-audio = { workspace = true }

[features]
default = []
sherpa = ["dep:sherpa-onnx"]

[[example]]
name = "sherpa_probe"
required-features = ["sherpa"]
