name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build app + installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livelinguist-windows-x64
          path: |
            packaging/nsis/LiveLinguist-*-setup.exe
            dist/LiveLinguist-*-portable.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} packaging/nsis/LiveLinguist-*-setup.exe dist/LiveLinguist-*-portable.zip --clobber
