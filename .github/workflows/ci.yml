name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  docs:
    name: Docs and pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version verification table is present
        run: test -s docs/qa/2026-11-21-version-verification.md
      - name: No committed secrets or model blobs
        run: |
          ! git ls-files | grep -Ei '(secret|token|\.gguf$|\.onnx$|\.wav$)' | grep -v '^tests/fixtures/'
      - name: Plans and ADRs exist
        run: |
          test -s docs/plans/2026-11-21-live-linguist-pc-master-plan.md
          for n in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015 0016; do
            test -s "docs/decisions/$n.md"
          done
