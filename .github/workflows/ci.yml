name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux X11 build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Re-run the sherpa-onnx-sys build script (its libs live outside the cached dirs)
        shell: bash
        run: rm -rf target/debug/build/sherpa-onnx-sys-* target/debug/.fingerprint/sherpa-onnx-sys-* target/sherpa-onnx-prebuilt
      - name: Clippy and test with sherpa-onnx (static libs from k2-fsa releases)
        run: |
          cargo clippy -p ll-asr -p ll-eval -p ll-bridge --features sherpa --all-targets -- -D warnings
          cargo test -p ll-asr --features sherpa
      - name: Clippy and test with llama.cpp (CPU, built from llama-cpp-sys-2 sources)
        run: |
          cargo clippy -p ll-llm --features llama --all-targets -- -D warnings
          cargo clippy -p ll-eval -p ll-bridge --features sherpa,llama --all-targets -- -D warnings
          cargo test -p ll-llm --features llama
          cargo test -p ll-eval --features sherpa,llama
      - name: Build napi addon (shipped features)
        if: matrix.os == 'windows-latest'
        run: cargo build -p ll-bridge --release --features capture,sherpa,llama
      - name: Eval mock scenario
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p ll-eval -- --scenario mock --language fr-FR --out target/eval-mock
      - name: Eval WAV replay
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p ll-eval -- --scenario mock --language fr-FR --wav tests/fixtures/sample.wav --out target/eval-wav
      - name: Eval simplify-only text
        if: matrix.os == 'ubuntu-latest'
        run: cargo run -p ll-eval -- --scenario simplify-only --language fr-FR --text "Il faudrait que tu viennes nous rendre visite dès que l'occasion se présentera." --out target/eval-text
      - name: Upload eval artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: eval-mock
          path: |
            target/eval-mock
            target/eval-wav
            target/eval-text

  docs:
    name: Docs and pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version verification table is present
        run: test -s docs/qa/2026-11-21-version-verification.md
      - name: No committed secrets or model blobs
        run: |
          ! git ls-files | grep -Ei '(secret|token|\.gguf$|\.onnx$|\.wav$)' | grep -v '^tests/fixtures/'
      - name: Plans and ADRs exist
        run: |
          test -s docs/plans/2026-11-21-live-linguist-pc-master-plan.md
          test -s docs/plans/2026-11-23-windows-v1-plan.md
          test -s docs/README.md
          for n in 0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013 0014 0015 0016 0017 0018 0019; do
            test -s "docs/decisions/$n.md"
          done

  bridge:
    name: Bridge and event delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux X11 build deps
        run: sudo apt-get update && sudo apt-get install -y libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build addon
        run: cargo build -p ll-bridge --release
      - name: Stage addon
        run: cp target/release/liblivelinguist_core.so tests/bridge/livelinguist-core.node
      - name: Functional bridge smoke (Node)
        run: node tests/bridge/bridge-smoke.mjs
      - name: 100 events/s x 10 s (Node)
        run: node tests/bridge/event-delivery.mjs 10
      - name: 100 events/s x 10 s (Bun)
        run: bun tests/bridge/event-delivery.mjs 10

  x11:
    name: X11 overlay policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: xvfb-run -a cargo test -p ll-window

  ui:
    name: UI typecheck and logic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run check

  ui-windows:
    name: UI on Windows (typecheck and logic tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # .gitattributes normalizes the checkout to LF, which Biome requires.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run check
